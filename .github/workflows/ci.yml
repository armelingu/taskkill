name: CI

on:
  push:
    branches: [desenv]
  pull_request:
    branches: [desenv]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verificar:
    name: Lint e verificação de sintaxe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt ruff

      - name: Verificar sintaxe dos módulos principais
        run: python -m py_compile app.py database.py routes.py

      - name: Lint com ruff
        run: |
          ruff check . \
            --select E,F,W \
            --ignore E501 \
            --exclude .venv

      - name: Testes de backend (pytest)
        env:
          TASKKILL_SECRET_KEY: ci-secret-key
          TASKKILL_ADMIN_PASSWORD: ci-admin-pass-123
        run: pytest

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testes de lógica pura (node --test)
        run: node --test tests/js/*.test.mjs
